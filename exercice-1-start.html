<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
        background: pink;
      }
  
      .container {
        height: 100vh;
        background: pink;
        
        display: flex;
        padding: 0 10em;
        box-sizing: border-box;

      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;

        gap: 1em;
        background: greenyellow;
      }

      header,
      footer {
        background: grey;
        height: 100px;
        flex-shrink: 0;
      }

      main {
        background: grey;

        flex: 1;
        min-height: 0;
      }
 
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <header>Header</header>
        <main>Main</main>
        <footer>Footer</footer>
      </div>
    </div>
  </body>
</html>
