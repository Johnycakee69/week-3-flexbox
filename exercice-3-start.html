<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: sans-serif;
                color: #fff;
            }

            .page {
                height: 100vh;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .header {
                background: #1e90ff;
                box-shadow: 0 2px 5px #0077ea;
                border-radius: 0.5rem;
                padding: 1rem;
                font-weight: bold;
            }
            .content {
                flex: 1;
                display: flex;
                gap: 1rem;
                min-height: 0;
            }

            .main {
                flex: 1;
                background: #3cb371;
                box-shadow: 0 2px 5px #2f8d59;
                border-radius: 0.5rem;
                padding: 1rem;

                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                align-content: flex-start;
            }

            .item {
                background: #2f8d59;
                box-shadow: 0 2px 5px #226741;
                border-radius: 0.5rem;
                width: 5rem;
                height: 4rem;

                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
            }

            .sidebar {
                flex: 0 0 7rem;
                background: #ff6347;
                box-shadow: 0 2px 5px #e02200;
                border-radius: 0.5;
                padding: 1rem;
                font-weight: bold;
            }

            .footer {
                background: #4169e1;
                box-shadow: 0 2px 5px #1d44b8;
                border-radius: 0.5rem;
                padding: 1rem;
                font-weight: bold;
            }
        </style>

    </head>
    <body>
        <div class="page"> 
            <header class="header">header</header>

            <div class="content">
                <main class="main">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </main>
                <aside class="sidebar">sidebar</aside>
            </div>

            <footer class="footer">footer</footer>
        </div>
    </body>
</html>
